# Config baked into the API image at /etc/masjid-digital-config/config.yaml.
# Override any key with an environment variable: MASJID_ + the key path in upper
# case with dots as underscores, e.g. MASJID_APP_AUTH_JWT_SECRET for app.auth.jwt_secret.
# Only keys listed here can be overridden, so keep every key present.

app:
  name: masjid-digital

  http_server:
    listen_address: 0.0.0.0
    port: "3000"
    graceful_timeout: 30s
    read_timeout: 30s
    write_timeout: 30s
    idle_timeout: 120s

  logger:
    level: info
    debug: false

  database:
    driver: postgres
    dsn: "" # required: set MASJID_APP_DATABASE_DSN, e.g. postgres://user:pass@db:5432/masjid_digital?sslmode=disable
    migrate_dsn: ""
    max_open_conns: 0
    max_idle_conns: 0
    conn_max_lifetime: 0s
    auto_migrate: true

  auth:
    jwt_secret: "" # required: set MASJID_APP_AUTH_JWT_SECRET
    token_ttl: 24h

  cache:
    driver: memory
    dsn: ""

client: {}
