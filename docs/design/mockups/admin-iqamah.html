<!doctype html><html lang="id"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0F3D33}a:hover{color:#1C6B3A}
button,input,select{font-family:inherit}
</style>
<style>html,body{margin:0;overflow:hidden;background:transparent}button,input{pointer-events:none}</style></head><body>

<div style="width: 390px; height: 1180px; box-sizing: border-box; background: #F4F1E8; display: flex; flex-direction: column; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F3D33; font-variant-numeric: tabular-nums;">
<div style="padding: 20px; display: flex; align-items: center; gap: 12px;">
<button type="button" aria-label="Kembali" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; color: #0F3D33; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<div style="font-size: 20px; font-weight: 800;">Iqamah &amp; Alarm</div>
</div>

<div style="padding: 0 20px; display: flex; flex-direction: column; gap: 14px; flex: 1;">
<div style="background: #FFFFFF; border-radius: 14px; padding: 6px 16px;">
<div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 8px 0; font-size: 11px; font-weight: 700; color: #5B6B64; letter-spacing: 0.5px;"><span>WAKTU</span><span>IQAMAH</span><span>MODE SHOLAT</span></div>
<div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid #ECE7DA; align-items: center; font-size: 14px;"><span style="font-weight: 600;">Subuh</span><button type="button" style="height: 36px; border: 1px solid #D9D2BE; border-radius: 10px; background: #FFFFFF; color: #0F3D33; font-size: 13px; font-weight: 600;">15 mnt</button><button type="button" style="height: 36px; border: 1px solid #D9D2BE; border-radius: 10px; background: #FFFFFF; color: #0F3D33; font-size: 13px; font-weight: 600;">15 mnt</button></div>
<div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid #ECE7DA; align-items: center; font-size: 14px;"><span style="font-weight: 600;">Dzuhur</span><button type="button" style="height: 36px; border: 1px solid #D9D2BE; border-radius: 10px; background: #FFFFFF; color: #0F3D33; font-size: 13px; font-weight: 600;">10 mnt</button><button type="button" style="height: 36px; border: 1px solid #D9D2BE; border-radius: 10px; background: #FFFFFF; color: #0F3D33; font-size: 13px; font-weight: 600;">12 mnt</button></div>
<div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid #ECE7DA; align-items: center; font-size: 14px;"><span style="font-weight: 600;">Ashar</span><button type="button" style="height: 36px; border: 1px solid #D9D2BE; border-radius: 10px; background: #FFFFFF; color: #0F3D33; font-size: 13px; font-weight: 600;">10 mnt</button><button type="button" style="height: 36px; border: 1px solid #D9D2BE; border-radius: 10px; background: #FFFFFF; color: #0F3D33; font-size: 13px; font-weight: 600;">12 mnt</button></div>
<div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid #ECE7DA; align-items: center; font-size: 14px;"><span style="font-weight: 600;">Maghrib</span><button type="button" style="height: 36px; border: 1px solid #D9D2BE; border-radius: 10px; background: #FFFFFF; color: #0F3D33; font-size: 13px; font-weight: 600;">7 mnt</button><button type="button" style="height: 36px; border: 1px solid #D9D2BE; border-radius: 10px; background: #FFFFFF; color: #0F3D33; font-size: 13px; font-weight: 600;">12 mnt</button></div>
<div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid #ECE7DA; align-items: center; font-size: 14px;"><span style="font-weight: 600;">Isya</span><button type="button" style="height: 36px; border: 1px solid #D9D2BE; border-radius: 10px; background: #FFFFFF; color: #0F3D33; font-size: 13px; font-weight: 600;">10 mnt</button><button type="button" style="height: 36px; border: 1px solid #D9D2BE; border-radius: 10px; background: #FFFFFF; color: #0F3D33; font-size: 13px; font-weight: 600;">15 mnt</button></div>
<div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid #ECE7DA; align-items: center; font-size: 14px;"><span style="font-weight: 600;">Jumat</span><span style="font-size: 12px; color: #5B6B64;">Setelah khutbah</span><button type="button" style="height: 36px; border: 1px solid #D9D2BE; border-radius: 10px; background: #FFFFFF; color: #0F3D33; font-size: 13px; font-weight: 600;">40 mnt</button></div>
<div style="font-size: 12px; color: #5B6B64; padding: 4px 0 10px;">Ketuk angka untuk ubah. Iqamah 1 sampai 30 menit, mode sholat 5 sampai 30 menit (Jumat sampai 60).</div>
</div>

<div style="background: #FFFFFF; border-radius: 14px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;">
<div><div style="font-size: 14px; font-weight: 700;">Durasi tampilan adzan</div><div style="font-size: 12px; color: #5B6B64;">Layar "Telah masuk waktu"</div></div>
<div style="display: flex; align-items: center; gap: 8px;">
<button type="button" aria-label="Kurangi" style="width: 36px; height: 36px; border: 1px solid #D9D2BE; border-radius: 10px; background: #FFFFFF; color: #0F3D33; font-size: 18px; font-weight: 700;">-</button>
<span style="font-size: 15px; font-weight: 700; min-width: 44px; text-align: center;">4 mnt</span>
<button type="button" aria-label="Tambah" style="width: 36px; height: 36px; border: 1px solid #D9D2BE; border-radius: 10px; background: #FFFFFF; color: #0F3D33; font-size: 18px; font-weight: 700;">+</button>
</div>
</div>

<fieldset style="background: #FFFFFF; border: 0; border-radius: 14px; padding: 14px 16px; margin: 0; display: flex; flex-direction: column; gap: 10px;">
<legend style="font-size: 14px; font-weight: 700; padding: 0; float: left; width: 100%;">Tampilan saat sholat</legend>
<label style="display: flex; align-items: center; gap: 10px; border: 2px solid #0F3D33; border-radius: 12px; padding: 12px; font-size: 14px;"><input type="radio" name="mode" checked style="width: 20px; height: 20px; accent-color: #0F3D33;"><span><b>Teks redup</b><br><span style="font-size: 12px; color: #5B6B64;">"Sholat sedang berlangsung" + jam kecil</span></span></label>
<label style="display: flex; align-items: center; gap: 10px; border: 1px solid #D9D2BE; border-radius: 12px; padding: 12px; font-size: 14px;"><input type="radio" name="mode" style="width: 20px; height: 20px; accent-color: #0F3D33;"><span><b>Gelap total</b><br><span style="font-size: 12px; color: #5B6B64;">Layar hitam penuh</span></span></label>
</fieldset>

<div style="background: #FFFFFF; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; justify-content: space-between; align-items: center;">
<div style="font-size: 14px; font-weight: 700;">Alarm</div>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;"><input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #0F3D33;">Aktif</label>
</div>
<label style="display: flex; align-items: center; gap: 10px; font-size: 13px;"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #0F3D33;">Saat masuk waktu adzan</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 13px;"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #0F3D33;">10 detik terakhir sebelum iqamah</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #4F6158;">Bunyi
<select style="height: 44px; border: 1px solid #D9D2BE; border-radius: 10px; padding: 0 12px; font-size: 14px; color: #0F3D33; background: #FFFFFF;"><option>Beep pendek</option><option>Bel lembut</option></select>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #4F6158;">Volume
<input type="range" min="0" max="100" value="70" style="accent-color: #0F3D33;">
</label>
<button type="button" style="height: 44px; border: 1px solid #D9D2BE; border-radius: 10px; background: #FFFFFF; color: #0F3D33; font-size: 13px; font-weight: 600;">Uji bunyi di semua layar</button>
</div>
</div>

<div style="padding: 16px 20px 24px;">
<button type="button" style="width: 100%; height: 52px; border: 0; border-radius: 14px; background: #0F3D33; color: #F4F1E8; font-size: 16px; font-weight: 700;">Simpan dan kirim ke layar</button>
</div>
</div>
</body></html>
