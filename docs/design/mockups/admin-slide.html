<!doctype html><html lang="id"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0F3D33}a:hover{color:#1C6B3A}
button,input,select{font-family:inherit}
</style>
<style>html,body{margin:0;overflow:hidden;background:transparent}button,input{pointer-events:none}</style></head><body>

<div style="width: 390px; height: 960px; box-sizing: border-box; background: #F4F1E8; display: flex; flex-direction: column; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F3D33;">
<div style="padding: 20px; display: flex; align-items: center; gap: 12px;">
<button type="button" aria-label="Kembali" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; color: #0F3D33; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<div style="font-size: 20px; font-weight: 800; flex: 1;">Slide</div>
<div style="font-size: 12px; font-weight: 600; color: #5B6B64;">3 aktif dari 4</div>
</div>

<div style="padding: 0 20px; display: flex; flex-direction: column; gap: 14px;">
<button type="button" style="border: 2px dashed #9FB3AA; border-radius: 14px; background: #FFFFFF; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #0F3D33;">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"></path></svg>
<span style="font-size: 14px; font-weight: 700;">Upload gambar</span>
<span style="font-size: 12px; color: #5B6B64;">Bisa pilih banyak sekaligus · JPG/PNG/WebP, maks 5 MB · disarankan 16:9</span>
</button>

<div style="background: #FFFFFF; border-radius: 14px; padding: 4px 12px;">
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #ECE7DA;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="#9FB3AA" aria-label="Geser untuk urutkan" role="img"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg>
<div style="width: 72px; height: 40px; border-radius: 8px; background: #2A5A4D; flex-shrink: 0;" aria-hidden="true"></div>
<div style="flex: 1; min-width: 0;"><div style="font-size: 14px; font-weight: 700;">Kajian Rutin Ahad Pagi</div><div style="font-size: 12px; color: #5B6B64;">10 dtk  ·  Semua layar</div></div>
<label style="display: flex; align-items: center;"><input type="checkbox" checked aria-label="Aktifkan slide Kajian Rutin Ahad Pagi" style="width: 22px; height: 22px; accent-color: #0F3D33;"></label>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #ECE7DA; background: #F7F4EC; margin: 0 -12px; padding-left: 12px; padding-right: 12px;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="#9FB3AA" aria-label="Geser untuk urutkan" role="img"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg>
<div style="width: 72px; height: 40px; border-radius: 8px; background: #C9A227; flex-shrink: 0;" aria-hidden="true"></div>
<div style="flex: 1; min-width: 0;"><div style="font-size: 14px; font-weight: 700;">Infaq Renovasi Atap</div><div style="font-size: 12px; color: #5B6B64;">15 dtk  ·  TV Ruang Utama</div></div>
<label style="display: flex; align-items: center;"><input type="checkbox" checked aria-label="Aktifkan slide Infaq Renovasi Atap" style="width: 22px; height: 22px; accent-color: #0F3D33;"></label>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #ECE7DA;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="#9FB3AA" aria-label="Geser untuk urutkan" role="img"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg>
<div style="width: 72px; height: 40px; border-radius: 8px; background: #4F7A6D; flex-shrink: 0;" aria-hidden="true"></div>
<div style="flex: 1; min-width: 0;"><div style="font-size: 14px; font-weight: 700;">Foto Kegiatan Santri TPA</div><div style="font-size: 12px; color: #5B6B64;">10 dtk  ·  Semua layar</div></div>
<label style="display: flex; align-items: center;"><input type="checkbox" checked aria-label="Aktifkan slide Foto Kegiatan Santri TPA" style="width: 22px; height: 22px; accent-color: #0F3D33;"></label>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 0;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="#9FB3AA" aria-label="Geser untuk urutkan" role="img"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg>
<div style="width: 72px; height: 40px; border-radius: 8px; background: #D9D2BE; flex-shrink: 0;" aria-hidden="true"></div>
<div style="flex: 1; min-width: 0;"><div style="font-size: 14px; font-weight: 700; color: #5B6B64;">Poster Idul Adha 1447</div><div style="font-size: 12px; color: #5B6B64;">Nonaktif</div></div>
<label style="display: flex; align-items: center;"><input type="checkbox" aria-label="Aktifkan slide Poster Idul Adha" style="width: 22px; height: 22px; accent-color: #0F3D33;"></label>
</div>
</div>
<div style="font-size: 12px; color: #5B6B64; margin-top: -6px;">Tahan dan geser untuk mengubah urutan. Ketuk slide untuk edit.</div>

<div style="background: #FFFFFF; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; justify-content: space-between; align-items: center;">
<div style="font-size: 14px; font-weight: 700;">Edit: Infaq Renovasi Atap</div>
<div style="width: 96px; height: 54px; border-radius: 8px; background: #C9A227;" aria-hidden="true"></div>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #4F6158;">Judul (tampil di caption)
<input type="text" value="Infaq Renovasi Atap" style="height: 44px; border: 1px solid #D9D2BE; border-radius: 10px; padding: 0 12px; font-size: 14px; color: #0F3D33; background: #FFFFFF;">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #4F6158;">Keterangan (opsional)
<input type="text" value="Transfer ke [BANK] [NO. REKENING] a.n. Masjid" style="height: 44px; border: 1px solid #D9D2BE; border-radius: 10px; padding: 0 12px; font-size: 14px; color: #0F3D33; background: #FFFFFF;">
</label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #4F6158;">Durasi
<select style="height: 44px; border: 1px solid #D9D2BE; border-radius: 10px; padding: 0 10px; font-size: 14px; color: #0F3D33; background: #FFFFFF;"><option>15 detik</option></select>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #4F6158;">Tampil di
<select style="height: 44px; border: 1px solid #D9D2BE; border-radius: 10px; padding: 0 10px; font-size: 14px; color: #0F3D33; background: #FFFFFF;"><option>TV Ruang Utama</option></select>
</label>
</div>
<div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px;">
<button type="button" style="height: 48px; border: 1px solid #E8C6B8; border-radius: 12px; background: #FFFFFF; color: #9A3B1E; font-size: 14px; font-weight: 700;">Hapus</button>
<button type="button" style="height: 48px; border: 0; border-radius: 12px; background: #0F3D33; color: #F4F1E8; font-size: 14px; font-weight: 700;">Simpan</button>
</div>
</div>
</div>
</div>
</body></html>
