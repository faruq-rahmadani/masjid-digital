<!doctype html><html lang="id"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0F3D33}a:hover{color:#1C6B3A}
button,input,select,textarea{font-family:inherit}
</style>
<style>html,body{margin:0;overflow:hidden;background:transparent}button,input{pointer-events:none}</style></head><body>

<div style="width: 390px; height: 900px; box-sizing: border-box; background: #F4F1E8; display: flex; flex-direction: column; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F3D33; font-variant-numeric: tabular-nums;">
<div style="padding: 20px; display: flex; align-items: center; gap: 12px;">
<button type="button" aria-label="Tutup" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; color: #0F3D33; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<div style="font-size: 20px; font-weight: 800;">Tambah Transaksi</div>
</div>

<div style="padding: 0 20px; display: flex; flex-direction: column; gap: 14px; flex: 1;">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; background: #E6E0CE; padding: 4px; border-radius: 14px;">
<button type="button" aria-pressed="true" style="height: 44px; border: 0; border-radius: 10px; background: #1C6B3A; color: #FFFFFF; font-size: 15px; font-weight: 700;">Pemasukan</button>
<button type="button" style="height: 44px; border: 0; border-radius: 10px; background: transparent; color: #4F6158; font-size: 15px; font-weight: 600;">Pengeluaran</button>
</div>

<div style="background: #FFFFFF; border-radius: 14px; padding: 18px 16px; text-align: center;">
<div style="font-size: 12px; font-weight: 600; color: #4F6158;">Nominal</div>
<div style="font-size: 36px; font-weight: 800; color: #1C6B3A; margin-top: 4px;">Rp 750.000</div>
</div>

<div style="background: #FFFFFF; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #4F6158;">Tanggal
<input type="text" value="Rabu, 28 Okt 2026" style="height: 44px; border: 1px solid #D9D2BE; border-radius: 10px; padding: 0 12px; font-size: 14px; color: #0F3D33; background: #FFFFFF;">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #4F6158;">Kategori
<select style="height: 44px; border: 1px solid #D9D2BE; border-radius: 10px; padding: 0 12px; font-size: 14px; color: #0F3D33; background: #FFFFFF;"><option>Infaq transfer</option><option>Kotak amal harian</option><option>Infaq Jumat</option></select>
</label>
<a href="#" style="font-size: 12px; font-weight: 600; margin-top: -4px;">Kelola kategori</a>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #4F6158;">Keterangan
<textarea rows="2" style="border: 1px solid #D9D2BE; border-radius: 10px; padding: 10px 12px; font-size: 14px; color: #0F3D33; background: #FFFFFF; resize: none;">Hamba Allah, untuk renovasi atap</textarea>
</label>
<div>
<div style="font-size: 12px; font-weight: 600; color: #4F6158; margin-bottom: 6px;">Foto bukti (opsional)</div>
<div style="display: flex; gap: 10px;">
<div style="width: 72px; height: 72px; border-radius: 10px; background: #DDE5E0; display: flex; align-items: center; justify-content: center; color: #4F6158;" role="img" aria-label="Foto bukti transfer terlampir"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M7 9h10M7 13h6"></path></svg></div>
<button type="button" aria-label="Tambah foto bukti" style="width: 72px; height: 72px; border: 2px dashed #9FB3AA; border-radius: 10px; background: #FFFFFF; color: #4F6158; font-size: 24px;">+</button>
</div>
</div>
</div>

<div style="background: #FBF6E6; border-radius: 12px; padding: 12px 14px; font-size: 12px; color: #5C4A12; line-height: 1.5;">Saldo setelah disimpan: <b>Rp 92.808.114</b>. Mengedit atau menghapus transaksi nanti wajib mengisi alasan, dan transaksi di bulan yang sudah tutup buku tidak bisa diubah.</div>
</div>

<div style="padding: 16px 20px 24px;">
<button type="button" style="width: 100%; height: 52px; border: 0; border-radius: 14px; background: #0F3D33; color: #F4F1E8; font-size: 16px; font-weight: 700;">Simpan transaksi</button>
</div>
</div>
</body></html>
