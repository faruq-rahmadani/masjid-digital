    get:
      tags: [Slide]
      summary: List every slide
      operationId: listSlides
      description: Any role. Active and inactive, in display order, without the images.
      responses:
        "200":
          description: The slides.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Slide"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [Slide]
      summary: Upload a slide
      operationId: createSlide
      description: |
        `super_admin` and `takmir`. One image per request. PNG, JPEG or WebP
        up to 5 MB, detected from the file's content. The slide is active and
        goes last; without `title`, the file name (minus extension, cut to 100
        characters) is used, and without `duration_seconds`, 10.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The slide image, 16:9 recommended.
                title:
                  type: string
                  maxLength: 100
                  description: Optional; defaults to the file name.
                caption:
                  type: string
                  maxLength: 200
                  description: Optional.
                duration_seconds:
                  type: integer
                  enum: [5, 10, 15, 20, 30]
                  description: Optional; defaults to 10.
                show_caption:
                  type: boolean
                  description: Optional; defaults to true.
      responses:
        "201":
          description: The created slide.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Slide"
        "400":
          description: |
            `file gambar wajib diunggah`, `ukuran gambar maksimal 5 MB`,
            `format gambar harus PNG, JPG, atau WebP`, `judul wajib diisi`,
            `judul maksimal 100 karakter`, `keterangan maksimal 200 karakter` or
            `durasi harus 5, 10, 15, 20, atau 30 detik`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_INPUT
                message: ukuran gambar maksimal 5 MB
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
