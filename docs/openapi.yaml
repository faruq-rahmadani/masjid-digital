      description: |
        The image bytes, for an `<img>` `src`. Any slide, active or not, so the
        admin list needs no token. A slide's image never changes and IDs are
        never reused, so it is sent with
        `Cache-Control: public, max-age=31536000, immutable`.
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: The image.
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=31536000, immutable
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/InvalidUserID"
        "404":
