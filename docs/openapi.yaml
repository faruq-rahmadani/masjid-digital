          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/FinanceNotFound"
        "422":
          $ref: "#/components/responses/BusinessRule"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/finance/transactions/{id}:
    put:
      tags: [Finance]
      summary: Edit a transaction
      operationId: updateTransaction
      description: "`super_admin` and `bendahara`. Open months only, with `reason`; the old values are kept as a revision. A split is edited as a whole, its lines in saved order; the kind never changes. Pindah dana is edited through /transfers."
      parameters:
        - $ref: "#/components/parameters/FinanceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveTransactionInput"
      responses:
        "200":
          description: The saved rows.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/FinanceNotFound"
        "422":
          $ref: "#/components/responses/BusinessRule"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [Finance]
      summary: Delete a transaction
      operationId: deleteTransaction
      description: "`super_admin` and `bendahara`. Soft delete with a reason, together with the rest of its group (a split or a Pindah dana pair). Open months only; refused when it would take a balance below Rp 0."
      parameters:
        - $ref: "#/components/parameters/FinanceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonInput"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: transaksi dihapus
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/FinanceNotFound"
        "422":
          $ref: "#/components/responses/BusinessRule"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/finance/transactions/{id}/revisions:
    get:
      tags: [Finance]
      summary: A transaction's history
      operationId: listTransactionRevisions
      description: "Any role. Each edit or delete with the row as it was and the reason, oldest first."
      parameters:
        - $ref: "#/components/parameters/FinanceID"
      responses:
        "200":
          description: The revisions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
