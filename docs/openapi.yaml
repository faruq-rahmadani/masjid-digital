          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /api/public/v1/finance/display:
    get:
      tags: [Public, Finance]
      summary: The TV kas header
      operationId: getFinanceDisplay
      description: "No login. Each open kas marked `show_on_tv` over the period set: saldo awal, pemasukan, pengeluaran and saldo akhir. Pindah dana counts as that kas's own in and out here, so the four columns add up."
      security: []
      responses:
        "200":
          description: The kas header.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/FinanceDisplay"
        "500":
          $ref: "#/components/responses/Internal"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    FinanceID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [INVALID_INPUT, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, ALREADY_EXISTS, BUSINESS_RULE, INTERNAL]
        message:
          type: string
          description: Indonesian message to show to the user.

    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string

    UserRole:
      type: string
      enum: [super_admin, takmir, bendahara]

    UserStatus:
      type: string
      enum: [active, disabled]
      description: Disabled users cannot log in. Users are never deleted, only disabled.

    User:
      type: object
      required: [id, name, phone, email, role, status, last_login_at, created_by, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          example: 7
        name:
          type: string
          example: Ahmad Fauzi
        phone:
          type: string
          description: E.164
          example: "+6281234567890"
        email:
          type: string
          description: Empty string when not set.
          example: ahmad@masjid.id
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserStatus"
        last_login_at:
          type: [string, "null"]
          format: date-time
          description: "`null` until the first login."
        created_by:
          type: integer
          format: int64
          description: ID of the user who created this one, `0` when nobody did.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserData:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/User"

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Email (when it contains `@`) or phone number in E.164.
        password:
          type: string
          minLength: 8
          maxLength: 128

    LoginResponse:
      type: object
      required: [token, expire_in]
      properties:
        token:
          type: string
          description: "Access token for the `Authorization: Bearer` header."
        expire_in:
          type: integer
          format: int64
          description: Seconds until the token expires.
          example: 86400

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
          maxLength: 128
          description: Must differ from `current_password`.

    ResetPasswordRequest:
      type: object
      required: [new_password]
      properties:
        new_password:
          type: string
          minLength: 8
          maxLength: 128

    CreateUserRequest:
      type: object
      required: [name, phone, password, role]
      properties:
        name:
          type: string
          maxLength: 100
          example: Ahmad Fauzi
        phone:
          type: string
          description: Normalized to E.164, see "Phone numbers" above.
          example: 0812-3456-7890
        email:
          type: string
          format: email
          description: Optional. Stored lowercase.
        password:
          type: string
          minLength: 8
          maxLength: 128
        role:
          $ref: "#/components/schemas/UserRole"

    UpdateUserRequest:
      type: object
      required: [name, phone, email, role, status]
      properties:
        name:
          type: string
          maxLength: 100
        phone:
          type: string
          description: Normalized to E.164, see "Phone numbers" above.
        email:
          type: string
          description: Empty string clears it.
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserStatus"

    MosqueTimezone:
      type: string
      enum: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura]
      description: "WIB (`Asia/Jakarta`), WITA (`Asia/Makassar`) or WIT (`Asia/Jayapura`)."

    MosqueProfile:
      type: object
      required: [name, address, contact_phone, latitude, longitude, timezone]
      properties:
        name:
          type: string
          maxLength: 100
          example: Masjid Al-Ikhlas
        address:
          type: string
          maxLength: 500
          description: Optional, empty string when not set.
          example: Jl. Merdeka No. 1, Bandung
        contact_phone:
          type: string
          description: Optional, E.164 (normalized like user phones), empty string when not set.
          example: "+6281234567890"
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: -6.917464
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 107.619125
        timezone:
          $ref: "#/components/schemas/MosqueTimezone"

    Prayer:
      type: string
      enum: [subuh, dzuhur, ashar, maghrib, isya]
      description: Imsak and Terbit follow Subuh and sunrise; they are adjusted only by settings.

    PrayerSettings:
      type: object
      required: [corrections, imsak_offset_min, weekly_overrides, hijri_offset_days, hijri_offset_from]
      properties:
        corrections:
          type: object
          description: Minutes added to each computed time every day, -10 to 10.
          required: [subuh, terbit, dzuhur, ashar, maghrib, isya]
          properties:
            subuh: { type: integer, minimum: -10, maximum: 10, example: 0 }
            terbit: { type: integer, minimum: -10, maximum: 10, example: 0 }
            dzuhur: { type: integer, minimum: -10, maximum: 10, example: 0 }
            ashar: { type: integer, minimum: -10, maximum: 10, example: 0 }
            maghrib: { type: integer, minimum: -10, maximum: 10, example: 2 }
            isya: { type: integer, minimum: -10, maximum: 10, example: 0 }
        imsak_offset_min:
          type: integer
          minimum: 1
          maximum: 30
          description: Minutes before Subuh. Defaults to 10.
          example: 10
        weekly_overrides:
          type: array
          description: At most one per weekday and prayer.
          items:
            type: object
            required: [weekday, prayer, time, remarks]
            properties:
              weekday:
                type: string
                enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
              prayer:
                $ref: "#/components/schemas/Prayer"
              time:
                type: string
                example: "12:00"
              remarks:
                type: string
                maxLength: 100
                example: Sholat Jumat
        hijri_offset_days:
          type: integer
          minimum: -2
          maximum: 2
          description: Days added to the computed Hijri date, e.g. after the sidang isbat.
          example: 0
        hijri_offset_from:
          type: string
          description: The date (YYYY-MM-DD) the Hijri offset applies from; empty means always.
          example: ""

    PrayerTimeOverride:
      type: object
      required: [id, date, prayer, time, remarks, created_by, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          example: 4
        date:
          type: string
          format: date
          example: "2026-11-06"
        prayer:
          $ref: "#/components/schemas/Prayer"
        time:
          type: string
          example: "11:58"
        remarks:
          type: string
          example: Khatib tamu
        created_by:
          type: integer
          format: int64
          description: 0 when nobody created it, e.g. seeded.
          example: 7
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PrayerMinutes:
      type: object
      required: [subuh, dzuhur, ashar, maghrib, isya]
      properties:
        subuh: { type: integer }
        dzuhur: { type: integer }
        ashar: { type: integer }
        maghrib: { type: integer }
        isya: { type: integer }

    IqamahSettings:
      type: object
      required: [iqamah_min, sholat_min, adzan_display_min, sholat_display, jumat_before_min, khutbah_min, alarm]
      properties:
        iqamah_min:
          description: Minutes from the adzan time to iqamah, 1..30.
          allOf:
            - $ref: "#/components/schemas/PrayerMinutes"
        sholat_min:
          description: How long mode sholat lasts, 5..30; `jumat` 5..60.
          allOf:
            - $ref: "#/components/schemas/PrayerMinutes"
            - type: object
              required: [jumat]
              properties:
                jumat: { type: integer, example: 40 }
        adzan_display_min:
          type: integer
          minimum: 1
          maximum: 10
          description: How long the "Telah masuk waktu" screen stays up. Defaults to 4.
        sholat_display:
          type: string
          enum: [dim, black]
          description: "`dim`: \"Sholat sedang berlangsung\" and a small clock; `black`: a black screen."
        jumat_before_min:
          type: integer
          minimum: 0
          maximum: 120
          description: The Jumat screen shows this long before Friday Dzuhur; 0 turns it off.
        khutbah_min:
          type: integer
          minimum: 10
          maximum: 60
        alarm:
          type: object
          required: [enabled, at_adzan, before_iqamah, sound, volume]
          properties:
            enabled: { type: boolean }
            at_adzan: { type: boolean }
            before_iqamah: { type: boolean, description: The last 10 seconds before iqamah. }
            sound: { type: string, enum: [beep, bell] }
            volume: { type: integer, minimum: 0, maximum: 100 }

    FridayDuty:
      type: object
      required: [date, khatib, imam, muadzin, theme, updated_by, created_at, updated_at]
      properties:
        date: { type: string, format: date, example: "2026-11-06" }
        khatib: { type: string, example: Ustadz Abdullah }
        imam: { type: string, example: Ustadz Hasan }
        muadzin: { type: string, example: Bilal Ahmad }
        theme: { type: string, description: Tema khutbah., example: Menjaga amanah }
        updated_by: { type: integer, format: int64, description: 0 when nobody set it. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ActivityLog:
      type: object
      required: [id, actor_id, actor_name, action, entity_id, summary, created_at]
      properties:
        id: { type: integer, format: int64 }
        actor_id: { type: integer, format: int64, description: 0 when nobody was logged in. }
        actor_name: { type: string, description: Empty when nobody was logged in., example: Hasan Basri }
        action:
          type: string
          description: What changed, `<thing>.<verb>`; new values may be added.
          enum:
            - user.created
            - user.updated
            - user.password_reset
            - mosque_profile.updated
            - mosque_logo.updated
            - mosque_logo.deleted
            - prayer_settings.updated
            - prayer_override.created
            - prayer_override.deleted
            - iqamah_settings.updated
            - friday_duty.saved
            - friday_duty.deleted
            - running_text.created
            - running_text.updated
            - running_text.deleted
            - running_text.reordered
            - running_text_setting.updated
            - slide.created
            - slide.updated
            - slide.deleted
            - slide.reordered
            - screen.updated
            - screen.blocked
            - screen.unblocked
          example: slide.created
        entity_id: { type: integer, format: int64, description: The changed row; 0 for a setting. }
        summary:
          type: string
          description: In Indonesian, shown after the actor's name ("Hasan Basri menambah slide ...").
          example: menambah slide "Kajian Ahad"
        created_at: { type: string, format: date-time, description: When it happened. }

    ScrollSpeed:
      type: string
      enum: [slow, medium, fast]
      description: How fast the INFO bar scrolls; the TV reads about 5, 8 or 12 characters a second.
      example: medium
    RunningTextSetting:
      type: object
      required: [speed]
      properties:
        speed:
          $ref: "#/components/schemas/ScrollSpeed"
    RunningTextInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed; counted in characters.
          example: Kerja bakti bersih masjid Ahad 2 Nov, kumpul pukul 07.00
    RunningText:
      type: object
      required: [id, text, active, position, created_by, created_by_name, deactivated_at, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          example: 4
        text:
          type: string
          example: Kajian Tafsir setiap Kamis ba'da Maghrib
        active:
          type: boolean
          description: Only active texts show on the TV.
        position:
          type: integer
          description: Display order, ascending; may have gaps after a delete.
          example: 0
        created_by:
          type: integer
          format: int64
          description: 0 when nobody created it, e.g. seeded.
          example: 7
        created_by_name:
          type: string
          description: The creator's name; empty when nobody created it.
          example: Ahmad Fauzi
        deactivated_at:
          type: [string, "null"]
          format: date-time
          description: |
            When the text was last turned off, i.e. last shown on the TV. Null while
            active and for texts never turned off. Editing an inactive text keeps it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SlideInput:
      type: object
      required: [title, caption, duration_seconds, show_caption, active]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; counted in characters. Shown in the TV caption.
          example: Infaq Renovasi Atap
        caption:
          type: string
          maxLength: 200
          description: Optional second line under the title; empty clears it.
          example: Transfer ke BSI 7123456789 a.n. Masjid Al-Ikhlas
        duration_seconds:
          type: integer
          enum: [5, 10, 15, 20, 30]
          example: 15
        show_caption:
          type: boolean
          description: Whether the TV shows the title and caption under the image; off for posters with their own text.
        active:
          type: boolean
    Slide:
      type: object
      required: [id, title, caption, duration_seconds, show_caption, active, position, created_by, created_by_name, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          example: 2
        title:
          type: string
          example: Infaq Renovasi Atap
        caption:
          type: string
          example: Transfer ke BSI 7123456789 a.n. Masjid Al-Ikhlas
        duration_seconds:
          type: integer
          description: How long the slide stays on screen; 10 for a new slide.
          example: 15
        show_caption:
          type: boolean
          description: Whether the TV shows the title and caption; when off the image fills the panel.
        active:
          type: boolean
          description: Only active slides show on the TV.
        position:
          type: integer
          description: Display order, ascending; may have gaps after a delete.
          example: 1
        created_by:
          type: integer
          format: int64
          description: 0 when nobody created it, e.g. seeded.
          example: 7
        created_by_name:
          type: string
          description: The creator's name; empty when nobody created it.
          example: Ahmad Fauzi
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DisplaySlide:
      type: object
      required: [id, title, caption, duration_seconds, show_caption]
      properties:
        id:
          type: integer
          format: int64
          example: 2
        title:
          type: string
          example: Infaq Renovasi Atap
        caption:
          type: string
          example: Transfer ke BSI 7123456789 a.n. Masjid Al-Ikhlas
        duration_seconds:
          type: integer
          example: 15
        show_caption:
          type: boolean
    ScreenMode:
      type: string
      enum: [auto, normal, jumat, dark]
      description: "`auto` follows the schedule; the others force the normal layout, the Jumat screen or a black screen."
    ScreenState:
      type: object
      required: [name, forced_mode, forced_until]
      properties:
        name: { type: string }
        forced_mode:
          $ref: "#/components/schemas/ScreenMode"
        forced_until: { type: [string, "null"], format: date-time, description: The forced mode ends here. }
    ScreenCommandRequest:
      type: object
      required: [command]
      properties:
        command:
          type: string
          enum: [reload, test_sound]
    Screen:
      type: object
      required: [id, device_id, name, name_hint, user_agent, forced_mode, forced_until, blocked_at, first_seen_at, updated_at, status, last_seen_at, app_version]
      properties:
        id: { type: integer, format: int64 }
        device_id: { type: string }
        name: { type: string, description: "Empty until an admin names it (shown as BARU)." }
        name_hint: { type: string, description: "From `/tv?layar=…`." }
        user_agent: { type: string }
        forced_mode:
          $ref: "#/components/schemas/ScreenMode"
        forced_until: { type: [string, "null"], format: date-time }
        blocked_at: { type: [string, "null"], format: date-time }
        first_seen_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        status: { type: string, enum: [online, offline], description: "Online while connected and for 2 minutes after." }
        last_seen_at: { type: [string, "null"], format: date-time, description: "Null when the cache has no record, e.g. after it was emptied." }
        app_version: { type: string }
    Account:
      type: object
      required: [id, name, kind, number, archived_at, created_by, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        name: {type: string, example: BSI Masjid}
        kind: {type: string, enum: [cash, bank]}
        number: {type: string, description: Bank account number; empty for cash.}
        archived_at: {type: [string, "null"], format: date-time}
        created_by: {type: integer, format: int64, description: 0 for seeded rows.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AccountWithBalance:
      allOf:
        - $ref: "#/components/schemas/Account"
        - type: object
          required: [balance]
          properties:
            balance: {type: integer, format: int64, description: Integer Rupiah.}
    AccountInput:
      type: object
      required: [name, kind]
      properties:
        name: {type: string, maxLength: 60}
        kind: {type: string, enum: [cash, bank]}
        number: {type: string, maxLength: 40, description: Ignored for cash.}
    AccountUpdate:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 60}
        number: {type: string, maxLength: 40}
    Pocket:
      type: object
      required: [id, kind, name, purpose, target_amount, surplus_plan, show_on_tv, status, created_by, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        kind: {type: string, enum: [umum, zakat_mal, zakat_fitrah, fidyah, terikat]}
        name: {type: string, example: Renovasi Atap}
        purpose: {type: string, description: Peruntukan.}
        target_amount: {type: [integer, "null"], format: int64, description: Terikat only; null = no target.}
        surplus_plan: {type: [string, "null"], enum: [to_umum, ask_donor], description: Terikat only.}
        show_on_tv: {type: boolean}
        status: {type: string, enum: [active, target_reached, done, archived]}
        created_by: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PocketWithBalance:
      allOf:
        - $ref: "#/components/schemas/Pocket"
        - type: object
          required: [balance, progress]
          properties:
            balance: {type: integer, format: int64}
            progress:
              description: Terikat kas with a target only; everything that came in, Pindah dana included.
              oneOf:
                - type: object
                  properties:
                    collected: {type: integer, format: int64}
                    target_reached: {type: boolean}
                - type: "null"
    TerikatPocketInput:
      type: object
      required: [name, purpose, surplus_plan]
      properties:
        name: {type: string, maxLength: 60}
        purpose: {type: string, maxLength: 200}
        target_amount: {type: [integer, "null"], format: int64, maximum: 10000000000, description: null or 0 = no target.}
        surplus_plan: {type: string, enum: [to_umum, ask_donor]}
        show_on_tv: {type: boolean}
    Category:
      type: object
      required: [id, name, type, scope, code, archived_at, created_by, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        name: {type: string, example: Infaq Jumat}
        type: {type: string, enum: [in, out]}
        scope: {type: string, enum: [umum_terikat, zakat, fidyah, all]}
        code: {type: [string, "null"], description: "System categories only, e.g. asnaf_fakir, pindah_out."}
        archived_at: {type: [string, "null"], format: date-time}
        created_by: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CategoryWithCount:
      allOf:
        - $ref: "#/components/schemas/Category"
        - type: object
          required: [transaction_count]
          properties:
            transaction_count: {type: integer, description: Transactions not deleted.}
    CategoryInput:
      type: object
      required: [name, type]
      properties:
        name: {type: string, maxLength: 60}
        type: {type: string, enum: [in, out]}
    CategoryRename:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 60}
    OpeningBalance:
      type: object
      required: [id, amount]
      properties:
        id: {type: integer, format: int64, description: Account or kas ID.}
        amount: {type: integer, format: int64, minimum: 0, maximum: 10000000000}
    StartBookkeepingInput:
      type: object
      required: [start_month]
      properties:
        start_month: {type: string, example: 2026-11, description: "YYYY-MM, not after this month on the mosque's clock."}
        accounts: {type: array, items: {$ref: "#/components/schemas/OpeningBalance"}}
        pockets: {type: array, items: {$ref: "#/components/schemas/OpeningBalance"}}
    BookClosing:
      type: object
      properties:
        id: {type: integer, format: int64}
        month: {type: string, example: 2026-10}
        kind: {type: string, enum: [opening, closing]}
        total_in: {type: integer, format: int64}
        total_out: {type: integer, format: int64}
        closing_balance: {type: integer, format: int64}
        accounts:
          type: array
          items:
            type: object
            properties:
              account_id: {type: integer, format: int64}
              closing_balance: {type: integer, format: int64}
              counted_balance: {type: [integer, "null"], format: int64}
        pockets:
          type: array
          items:
            type: object
            properties:
              pocket_id: {type: integer, format: int64}
              closing_balance: {type: integer, format: int64}
        closed_by: {type: integer, format: int64}
        closed_at: {type: string, format: date-time}
        reopened_at: {type: [string, "null"], format: date-time}
        reopen_reason: {type: string}
    Bookkeeping:
      type: object
      required: [started, start_month, opening]
      properties:
        started: {type: boolean}
        start_month: {type: string, description: "YYYY-MM; empty before pembukuan starts."}
        opening:
          oneOf:
            - $ref: "#/components/schemas/BookClosing"
            - type: "null"
    Flow:
      type: object
      properties:
        opening: {type: integer, format: int64}
        in: {type: integer, format: int64}
        out: {type: integer, format: int64}
        moved: {type: integer, format: int64, description: Pindah dana in minus out.}
        closing: {type: integer, format: int64}
    FinanceSummary:
      type: object
      properties:
        month: {type: string, example: 2026-11}
        today: {type: string, example: 2026-11-11}
        closed: {type: boolean}
        total_in: {type: integer, format: int64}
        total_out: {type: integer, format: int64}
        today_in: {type: integer, format: int64}
        today_out: {type: integer, format: int64}
        balance: {type: integer, format: int64, description: Every kas together at the end of the month.}
        pockets:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Flow"
              - type: object
                properties:
                  pocket_id: {type: integer, format: int64}
                  today_in: {type: integer, format: int64}
                  today_out: {type: integer, format: int64}
        accounts:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Flow"
              - type: object
                properties:
                  account_id: {type: integer, format: int64}
        warnings:
          type: array
          items:
            type: object
            properties:
              kind: {type: string, enum: [amil_cap, fitrah_deadline]}
              pocket_id: {type: integer, format: int64}
              message: {type: string}
    Transaction:
      type: object
      properties:
        id: {type: integer, format: int64}
        kind: {type: string, enum: [in, out]}
        amount: {type: integer, format: int64}
        date: {type: string, example: 2026-11-06}
        account_id: {type: integer, format: int64}
        pocket_id: {type: integer, format: int64}
        category_id: {type: integer, format: int64}
        group_id: {type: [string, "null"]}
        donor_consent: {type: boolean}
        corrects_id: {type: [integer, "null"], format: int64}
        note: {type: string}
        donor_note: {type: string}
        has_photo: {type: boolean}
        created_by: {type: integer, format: int64}
        updated_by: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: [string, "null"], format: date-time}
        deleted_by: {type: integer, format: int64}
    SaveTransactionInput:
      type: object
      required: [kind, date, account_id, lines]
      properties:
        kind: {type: string, enum: [in, out]}
        date: {type: string, example: 2026-11-06}
        account_id: {type: integer, format: int64}
        lines:
          type: array
          items:
            type: object
            required: [pocket_id, category_id, amount]
            properties:
              pocket_id: {type: integer, format: int64}
              category_id: {type: integer, format: int64}
              amount: {type: integer, format: int64, minimum: 1, maximum: 10000000000}
        note: {type: string, maxLength: 200}
        donor_note: {type: string, maxLength: 200}
        corrects_id: {type: [integer, "null"], format: int64, description: A transaction in a closed month this one corrects.}
        reason: {type: string, maxLength: 200, description: Required when editing.}
    ReasonInput:
      type: object
      required: [reason]
      properties:
        reason: {type: string, maxLength: 200}
    MoveFundsInput:
      type: object
      required: [from_pocket_id, from_account_id, to_pocket_id, to_account_id, amount, date]
      properties:
        from_pocket_id: {type: integer, format: int64}
        from_account_id: {type: integer, format: int64}
        to_pocket_id: {type: integer, format: int64}
        to_account_id: {type: integer, format: int64}
        amount: {type: integer, format: int64, minimum: 1, maximum: 10000000000}
        date: {type: string}
        note: {type: string, maxLength: 200, description: The reason; required out of a terikat kas.}
        donor_consent: {type: boolean}
        reason: {type: string, maxLength: 200, description: Required when editing.}
    TransactionRevision:
      type: object
      properties:
        id: {type: integer, format: int64}
        transaction_id: {type: integer, format: int64}
        action: {type: string, enum: [edit, delete]}
        previous: {$ref: "#/components/schemas/Transaction"}
        reason: {type: string}
        user_id: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
    FinishPocketInput:
      type: object
      properties:
        account_id: {type: integer, format: int64, description: Where the remainder sits; the move does not change it.}
        donor_consent: {type: boolean}
        note: {type: string, maxLength: 200}
    CloseMonthInput:
      type: object
      required: [month, accounts]
      properties:
        month: {type: string, example: 2026-10}
        accounts:
          type: array
          items:
            type: object
            required: [account_id, counted]
            properties:
              account_id: {type: integer, format: int64}
              counted: {type: integer, format: int64, minimum: 0}
    FinanceTvSetting:
      type: object
      required: [period]
      properties:
        period: {type: string, enum: [today, week, month]}
    FinanceDisplay:
      type: object
      properties:
        period: {type: string, enum: [today, week, month]}
        from: {type: string}
        to: {type: string}
        pockets:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Flow"
              - type: object
                properties:
                  id: {type: integer, format: int64}
                  name: {type: string}
                  kind: {type: string, enum: [umum, zakat_mal, zakat_fitrah, fidyah, terikat]}
  responses:
    FinanceNotFound:
      description: No account, kas or category has the ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_FOUND
            message: kas tidak ditemukan
    FinanceAlreadyExists:
      description: The name is taken.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: ALREADY_EXISTS
            message: nama kas sudah dipakai
    BusinessRule:
      description: Valid data that breaks a rule; `message` says which.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: BUSINESS_RULE
            message: kas hanya bisa diarsipkan saat saldonya Rp 0
    ScreenNotFound:
      description: No screen has this ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_FOUND
            message: layar tidak ditemukan
    InvalidRunningText:
      description: "`teks wajib diisi` or `teks maksimal 200 karakter`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INVALID_INPUT
            message: teks maksimal 200 karakter
    RunningTextNotFound:
      description: No running text with this ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_FOUND
            message: running text tidak ditemukan
    SlideNotFound:
      description: No slide with this ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_FOUND
            message: slide tidak ditemukan
    InvalidInput:
      description: The request is malformed or a field is invalid; `message` says which.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INVALID_INPUT
            message: nomor HP tidak valid
    InvalidUserID:
      description: The `id` path parameter is not a positive integer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INVALID_INPUT
            message: id tidak valid
    Unauthenticated:
      description: |
        No token (`silakan login terlebih dahulu`), or the token is invalid,
        expired, logged out or replaced by a newer login
        (`sesi tidak valid, silakan login ulang`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: UNAUTHENTICATED
            message: sesi tidak valid, silakan login ulang
    Forbidden:
      description: The user's role is not allowed to call this endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: FORBIDDEN
            message: anda tidak memiliki akses
    UserNotFound:
      description: No user with this ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_FOUND
            message: user tidak ditemukan
    UserAlreadyExists:
      description: Another user already has this phone or email.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: ALREADY_EXISTS
            message: nomor HP atau email sudah terdaftar
    MosqueLogoNotFound:
      description: No logo has been uploaded yet.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_FOUND
            message: logo masjid belum diunggah
    TooLarge:
      description: The request body is over the size limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INVALID_INPUT
            message: ukuran request terlalu besar
    Internal:
      description: Unexpected server failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INTERNAL
            message: Internal Server Error
