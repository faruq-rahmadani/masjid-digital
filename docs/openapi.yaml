                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/FinanceNotFound"
        "422":
          $ref: "#/components/responses/BusinessRule"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/finance/pockets/{id}/finish:
    post:
      tags: [Finance]
      summary: Selesaikan program
      operationId: finishPocket
      description: "`super_admin` and `bendahara`. Moves a terikat kas's remainder to Kas Umum as a Pindah dana dated today, then archives it. With rencana sisa dana `ask_donor`, `donor_consent` and `note` are required."
      parameters:
        - $ref: "#/components/parameters/FinanceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishPocketInput"
      responses:
        "200":
          description: The archived kas.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Pocket"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/FinanceNotFound"
        "422":
          $ref: "#/components/responses/BusinessRule"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/finance/closings:
    get:
      tags: [Finance]
      summary: List the book closings
      operationId: listClosings
      description: "Any role. The opening and every closed month, oldest first, with their balances."
      responses:
        "200":
          description: The closings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BookClosing"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [Finance]
      summary: Tutup buku
      operationId: closeMonth
      description: "`super_admin` and `bendahara`. Only the month after the last closing, once it has ended. Every account's counted balance must equal its computed one; a difference is recorded as a transaction first. Locks the month."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseMonthInput"
      responses:
        "201":
          description: The closing.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/BookClosing"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/BusinessRule"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/finance/tv-setting:
    get:
      tags: [Finance]
