  /api/public/v1/screens/{device_id}/events:
    get:
      tags: [Public, Screens]
      summary: The TV's live connection
      operationId: streamScreenEvents
      security: []
      description: |
        Server-sent events (`text/event-stream`), kept open with a `: ping` comment every 25 s.
        Registers the device the first time (at most 50 screens). Events, each with JSON `data`:

        - `state`: the screen's `ScreenState`, first on connect and again when an admin changes it
        - `refresh`: content shown on the TV changed; reload the data now
        - `reload`: reload the page
        - `test_sound`: play the alarm sound once
        - `blocked`: an admin blocked this device; the stream ends. A blocked device that connects
          gets only this event, with `retry: 300000`, so it checks back every 5 minutes.
      parameters:
        - name: device_id
          in: path
          required: true
          description: 8-64 letters, digits or dashes, e.g. a UUID kept in the TV's localStorage.
          schema: { type: string, example: 2f1c9a7e-5b8d-4c3a-9e21-7d6f0b4a8c11 }
        - name: name
          in: query
          description: From `/tv?layar=…`, suggested to the admin when naming the screen.
          schema: { type: string, maxLength: 50, example: teras }
        - name: v
          in: query
          description: The TV app's version.
          schema: { type: string, maxLength: 30, example: 1.4.0 }
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                retry: 5000
                event: state
                data: {"name":"TV Teras","forced_mode":"auto","forced_until":null}

                event: refresh
                data: null
        "400":
          $ref: "#/components/responses/InvalidInput"
        "422":
          description: "A new device when 50 screens are registered: `jumlah layar sudah mencapai batas 50`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

