openapi: 3.1.0
info:
  title: Masjid Digital API
  version: 1.0.0
  description: |
    Backend API of Masjid Digital. Each deployment serves a single mosque.

    ## Authentication
    `POST /api/v1/auth/login` returns an access token. Send it on every other
    request as `Authorization: Bearer <token>`, except the read-only
    `/api/public/v1/*` routes, which need no login (the TV display uses them).

    A user has one session at a time: logging in again (on any device) makes
    the previous token stop working. A token also stops working when the user
    logs out, is disabled, has their role changed, or has their password reset
    by an admin.

    ## Roles
    - `super_admin`: manages the whole app, including users
    - `takmir`: runs the mosque's operations
    - `bendahara`: the treasurer

    ## Errors
    Every error has the same body, `{"code": ..., "message": ...}`. `message`
    is in Indonesian and meant to be shown to the user as is. `code` maps to
    the HTTP status:

    | code              | status |
    |-------------------|--------|
    | `INVALID_INPUT`   | 400    |
    | `UNAUTHENTICATED` | 401    |
    | `FORBIDDEN`       | 403    |
    | `NOT_FOUND`       | 404    |
    | `ALREADY_EXISTS`  | 409    |
    | `BUSINESS_RULE`   | 422    |
    | `INTERNAL`        | 500    |

    Request bodies are limited to 1 MB (3 MB for the logo upload); a larger
    one gets `413` with `"ukuran request terlalu besar"`.

    ## Phone numbers
    Phones are stored in E.164 (`+6281234567890`). When creating or updating,
    `0812-3456-7890`, `6281234567890` and `+62 812 3456 7890` are all accepted
    and normalized; Indonesian numbers must be mobile numbers (`+628...`).
    On login the identifier is matched as is, so send the phone in E.164.
servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Users
    description: User management, `super_admin` only.
  - name: Mosque Profile
  - name: Prayer Times
    description: |
      Prayer times are computed on each device from the mosque's location with
      the Kemenag method (Subuh 20°, Isya 18°, ihtiyat 2 minutes); the server
      only stores how the mosque adjusts them. From the most general layer:
      computed time, then `corrections`, then a weekly override (e.g. every
      Friday Dzuhur), then a date override. The most specific one wins.
  - name: Iqamah
    description: |
      What the TV does around each prayer: the adzan screen, the iqamah countdown, mode sholat,
      and on Friday the Jumat screen and khutbah; plus the alarm.
  - name: Friday Duties
    description: Petugas Jumat (khatib, imam, muadzin, tema khutbah) per Friday, shown on the TV's Jumat screen.
  - name: Public
    description: Read only, no login, for screens anyone can see (the TV display).

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthcheck
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: ok

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      operationId: login
      description: |
        Logs in with a phone number (E.164) or an email, and replaces any
        earlier session of the user. A wrong identifier and a wrong password
        give the same error, so the response does not reveal who is registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              phone:
                value:
                  identifier: "+6281234567890"
                  password: bismillah123
              email:
                value:
                  identifier: admin@masjid.id
                  password: bismillah123
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          description: Wrong identifier or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: UNAUTHENTICATED
                message: nomor HP/email atau password salah
        "403":
          description: The account is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: FORBIDDEN
                message: akun dinonaktifkan
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      operationId: logout
      description: Ends the current session, so the token stops working before it expires.
      responses:
        "200":
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: logout berhasil
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/profile:
    get:
      tags: [Auth]
      summary: Get own account
      operationId: getProfile
      description: Returns the logged in user. Any role.
      responses:
        "200":
          description: The logged in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserData"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/password:
    put:
      tags: [Auth]
      summary: Change own password
      operationId: changePassword
      description: Any role. The current session stays logged in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: password berhasil diganti
        "400":
          description: |
            Invalid input, e.g. `password lama wajib di isi`,
            `password minimal 8 karakter`, `password lama salah`,
            `password baru harus berbeda dari password lama`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_INPUT
                message: password lama salah
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/users:
    post:
      tags: [Users]
      summary: Create a user
      operationId: createUser
      description: "`super_admin` only. The new user is `active`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: user berhasil dibuat
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/UserAlreadyExists"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      tags: [Users]
      summary: List users
      operationId: findAllUsers
      description: "`super_admin` only. Includes disabled users."
      responses:
        "200":
          description: All users.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [Users]
      summary: Get a user
      operationId: findUserByID
      description: "`super_admin` only."
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserData"
        "400":
          $ref: "#/components/responses/InvalidUserID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      tags: [Users]
      summary: Update a user
      operationId: updateUser
      description: |
        `super_admin` only. Replaces every editable field, so send all of them;
        an empty `email` clears it. Disabling a user or changing their role
        logs them out. Admins cannot change their own role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserData"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            Not a `super_admin` (`anda tidak memiliki akses`), or changing
            one's own role (`tidak bisa mengubah role sendiri`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: FORBIDDEN
                message: tidak bisa mengubah role sendiri
        "404":
          $ref: "#/components/responses/UserNotFound"
        "409":
          $ref: "#/components/responses/UserAlreadyExists"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/UserID"
    put:
      tags: [Users]
      summary: Reset a user's password
      operationId: resetPassword
      description: |
        `super_admin` only. Sets a new password without the old one and logs
        the user out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: password berhasil direset
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /api/public/v1/time:
    get:
      tags: [Public]
      summary: Get the server's clock
      operationId: getServerTime
      security: []
      description: |
        The TV display corrects its own clock with this (a TV's clock is often
        unset or drifting). Sent with `Cache-Control: no-store`.
      responses:
        "200":
          description: The server's current time.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [now]
                    properties:
                      now:
                        type: integer
                        format: int64
                        description: Unix time in milliseconds.
                        example: 1793492835123

  /api/public/v1/mosque-profile:
    get:
      tags: [Public]
      summary: Get the mosque profile without logging in
      operationId: getPublicMosqueProfile
      security: []
      description: Same response as `GET /api/v1/mosque-profile`.
      responses:
        "200":
          description: The mosque profile.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MosqueProfile"
        "404":
          description: The profile has not been saved yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: NOT_FOUND
                message: profil masjid belum diisi
        "500":
          $ref: "#/components/responses/Internal"

  /api/public/v1/mosque-profile/logo:
    get:
      tags: [Public]
      summary: Get the mosque logo without logging in
      operationId: getPublicMosqueLogo
      security: []
      description: Same response as `GET /api/v1/mosque-profile/logo`.
      responses:
        "200":
          description: The logo.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [url]
                    properties:
                      url:
                        type: string
                        description: "`data:<content type>;base64,<image>`"
        "404":
          $ref: "#/components/responses/MosqueLogoNotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/mosque-profile:
    get:
      tags: [Mosque Profile]
      summary: Get the mosque profile
      operationId: getMosqueProfile
      description: Any role.
      responses:
        "200":
          description: The mosque profile.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MosqueProfile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: The profile has not been saved yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: NOT_FOUND
                message: profil masjid belum diisi
        "500":
          $ref: "#/components/responses/Internal"
    put:
      tags: [Mosque Profile]
      summary: Save the mosque profile
      operationId: updateMosqueProfile
      description: |
        `super_admin` and `takmir`. Replaces every field, so send all of them;
        an empty `address` or `contact_phone` clears it. Also creates the
        profile the first time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MosqueProfile"
      responses:
        "200":
          description: The saved profile.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MosqueProfile"
        "400":
          description: |
            Invalid input, e.g. `nama wajib di isi`, `alamat maksimal 500 karakter`,
            `kontak pengurus harus nomor HP yang valid`, `lokasi masjid wajib di isi`
            (latitude and longitude both 0), `koordinat lokasi tidak valid`,
            `zona waktu harus WIB, WITA, atau WIT`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_INPUT
                message: lokasi masjid wajib di isi
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/mosque-profile/logo:
    get:
      tags: [Mosque Profile]
      summary: Get the mosque logo
      operationId: getMosqueLogo
      description: Any role. The logo comes back as a data URI, usable directly as an `<img>` `src`.
      responses:
        "200":
          description: The logo.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [url]
                    properties:
                      url:
                        type: string
                        description: "`data:<content type>;base64,<image>`"
                        example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA...
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/MosqueLogoNotFound"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      tags: [Mosque Profile]
      summary: Upload the mosque logo
      operationId: updateMosqueLogo
      description: |
        `super_admin` and `takmir`. Replaces the current logo. PNG, JPEG or
        WebP up to 2 MB; the format is detected from the file's content, not
        its name or declared type. SVG is not accepted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The logo image.
      responses:
        "200":
          description: Logo saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: logo masjid berhasil disimpan
        "400":
          description: |
            Invalid upload, e.g. `file logo wajib diunggah`,
            `ukuran logo maksimal 2 MB`, `format logo harus PNG, JPG, atau WebP`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_INPUT
                message: format logo harus PNG, JPG, atau WebP
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/TooLarge"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [Mosque Profile]
      summary: Delete the mosque logo
      operationId: deleteMosqueLogo
      description: "`super_admin` and `takmir`."
      responses:
        "200":
          description: Logo deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: logo masjid berhasil dihapus
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MosqueLogoNotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /api/public/v1/prayer-time/config:
    get:
      tags: [Public, Prayer Times]
      summary: Get what a device needs to compute the prayer times
      operationId: getPrayerConfig
      security: []
      description: |
        The settings (defaults until first saved) and the date overrides from
        today to 30 days ahead, so a TV keeps showing correct times offline.
      responses:
        "200":
          description: The prayer config.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [settings, overrides]
                    properties:
                      settings:
                        $ref: "#/components/schemas/PrayerSettings"
                      overrides:
                        type: array
                        items:
                          $ref: "#/components/schemas/PrayerTimeOverride"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/prayer-time/config:
    get:
      tags: [Prayer Times]
      summary: Get the prayer settings
      operationId: getPrayerSettings
      description: Any role. Returns the defaults until first saved.
      responses:
        "200":
          description: The prayer settings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PrayerSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      tags: [Prayer Times]
      summary: Save the prayer settings
      operationId: updatePrayerSettings
      description: |
        `super_admin` and `takmir`. Replaces every setting, so send all of them.
        Also creates the settings the first time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrayerSettings"
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PrayerSettings"
        "400":
          description: |
            Invalid input, e.g. `koreksi waktu harus antara -10 dan +10 menit`,
            `imsak harus 1 sampai 30 menit sebelum subuh`, `hari tidak valid`,
            `format jam harus HH:MM`,
            `satu waktu sholat hanya boleh punya satu jadwal mingguan per hari`,
            `koreksi tanggal hijriah harus antara -2 dan +2 hari`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_INPUT
                message: koreksi waktu harus antara -10 dan +10 menit
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/prayer-time/overrides:
    get:
      tags: [Prayer Times]
      summary: List the date overrides in a range
      operationId: listPrayerOverrides
      description: Any role. Ordered by date, then prayer.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-11-01"
        - name: to
          in: query
          required: true
          description: Inclusive, at most 366 days after `from`.
          schema:
            type: string
            format: date
            example: "2026-11-30"
      responses:
        "200":
          description: The overrides.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PrayerTimeOverride"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [Prayer Times]
      summary: Override one prayer time on one date
      operationId: createPrayerOverride
      description: "`super_admin` and `takmir`. The date must not be in the past."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, prayer, time]
              properties:
                date:
                  type: string
                  format: date
                  example: "2026-11-06"
                prayer:
                  $ref: "#/components/schemas/Prayer"
                time:
                  type: string
                  pattern: "^\\d{2}:\\d{2}$"
                  example: "11:58"
                remarks:
                  type: string
                  maxLength: 100
                  example: Khatib tamu
      responses:
        "201":
          description: The created override.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PrayerTimeOverride"
        "400":
          description: |
            Invalid input, e.g. `format tanggal harus YYYY-MM-DD`,
            `waktu sholat tidak valid`, `format jam harus HH:MM`, `tanggal sudah lewat`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_INPUT
                message: tanggal sudah lewat
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The prayer already has an override on that date; delete it first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: ALREADY_EXISTS
                message: waktu sholat ini sudah punya jadwal khusus di tanggal tersebut
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/prayer-time/overrides/{id}:
    delete:
      tags: [Prayer Times]
      summary: Delete a date override
      operationId: deletePrayerOverride
      description: "`super_admin` and `takmir`."
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Override deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: jadwal khusus dihapus
        "400":
          $ref: "#/components/responses/InvalidUserID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No override with this ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: NOT_FOUND
                message: jadwal khusus tidak ditemukan
        "500":
          $ref: "#/components/responses/Internal"

  /api/public/v1/iqamah/config:
    get:
      tags: [Public, Iqamah]
      summary: Get the iqamah settings without logging in
      operationId: getPublicIqamahSettings
      security: []
      description: The defaults until first saved.
      responses:
        "200":
          description: The iqamah settings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/IqamahSettings"
        "500":
          $ref: "#/components/responses/Internal"

  /api/public/v1/friday-duties:
    get:
      tags: [Public, Friday Duties]
      summary: List the coming petugas Jumat without logging in
      operationId: listUpcomingFridayDuties
      security: []
      description: Petugas Jumat from today to 30 days ahead, ordered by date, so the TV still shows them offline.
      responses:
        "200":
          description: The petugas Jumat.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FridayDuty"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/iqamah/config:
    get:
      tags: [Iqamah]
      summary: Get the iqamah settings
      operationId: getIqamahSettings
      description: Any role. Returns the defaults until first saved.
      responses:
        "200":
          description: The iqamah settings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/IqamahSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      tags: [Iqamah]
      summary: Save the iqamah settings
      operationId: updateIqamahSettings
      description: "`super_admin` and `takmir`. Replaces every setting; also creates them the first time."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IqamahSettings"
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/IqamahSettings"
        "400":
          description: |
            Invalid input, e.g. `iqamah harus 1 sampai 30 menit`,
            `mode sholat harus 5 sampai 30 menit`, `mode sholat Jumat harus 5 sampai 60 menit`,
            `durasi tampilan adzan harus 1 sampai 10 menit`, `durasi khutbah harus 10 sampai 60 menit`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_INPUT
                message: iqamah harus 1 sampai 30 menit
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/friday-duties:
    get:
      tags: [Friday Duties]
      summary: List petugas Jumat in a range
      operationId: listFridayDuties
      description: Any role. Ordered by date.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date, example: "2026-11-01" }
        - name: to
          in: query
          required: true
          description: Inclusive, at most 366 days after `from`.
          schema: { type: string, format: date, example: "2026-11-30" }
      responses:
        "200":
          description: The petugas Jumat.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FridayDuty"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/friday-duties/{date}:
    parameters:
      - name: date
        in: path
        required: true
        description: A Friday, YYYY-MM-DD.
        schema: { type: string, format: date, example: "2026-11-06" }
    put:
      tags: [Friday Duties]
      summary: Set the petugas of a Friday
      operationId: saveFridayDuty
      description: |
        `super_admin` and `takmir`. Creates or replaces that Friday's petugas. The date must be a
        Friday not in the past; at least one of khatib, imam, muadzin is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                khatib: { type: string, maxLength: 100, example: Ustadz Abdullah }
                imam: { type: string, maxLength: 100, example: Ustadz Hasan }
                muadzin: { type: string, maxLength: 100, example: Bilal Ahmad }
                theme: { type: string, maxLength: 200, example: Menjaga amanah }
      responses:
        "200":
          description: The saved petugas.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/FridayDuty"
        "400":
          description: |
            Invalid input, e.g. `petugas Jumat hanya untuk hari Jumat`, `isi minimal satu petugas`,
            `tanggal sudah lewat`, `nama petugas maksimal 100 karakter`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_INPUT
                message: petugas Jumat hanya untuk hari Jumat
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [Friday Duties]
      summary: Delete the petugas of a Friday
      operationId: deleteFridayDuty
      description: "`super_admin` and `takmir`."
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: petugas Jumat dihapus
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: That Friday has no petugas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: NOT_FOUND
                message: petugas Jumat tidak ditemukan
        "500":
          $ref: "#/components/responses/Internal"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [INVALID_INPUT, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, ALREADY_EXISTS, BUSINESS_RULE, INTERNAL]
        message:
          type: string
          description: Indonesian message to show to the user.

    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string

    UserRole:
      type: string
      enum: [super_admin, takmir, bendahara]

    UserStatus:
      type: string
      enum: [active, disabled]
      description: Disabled users cannot log in. Users are never deleted, only disabled.

    User:
      type: object
      required: [id, name, phone, email, role, status, last_login_at, created_by, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          example: 7
        name:
          type: string
          example: Ahmad Fauzi
        phone:
          type: string
          description: E.164
          example: "+6281234567890"
        email:
          type: string
          description: Empty string when not set.
          example: ahmad@masjid.id
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserStatus"
        last_login_at:
          type: [string, "null"]
          format: date-time
          description: "`null` until the first login."
        created_by:
          type: integer
          format: int64
          description: ID of the user who created this one, `0` when nobody did.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserData:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/User"

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Email (when it contains `@`) or phone number in E.164.
        password:
          type: string
          minLength: 8
          maxLength: 128

    LoginResponse:
      type: object
      required: [token, expire_in]
      properties:
        token:
          type: string
          description: "Access token for the `Authorization: Bearer` header."
        expire_in:
          type: integer
          format: int64
          description: Seconds until the token expires.
          example: 86400

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
          maxLength: 128
          description: Must differ from `current_password`.

    ResetPasswordRequest:
      type: object
      required: [new_password]
      properties:
        new_password:
          type: string
          minLength: 8
          maxLength: 128

    CreateUserRequest:
      type: object
      required: [name, phone, password, role]
      properties:
        name:
          type: string
          maxLength: 100
          example: Ahmad Fauzi
        phone:
          type: string
          description: Normalized to E.164, see "Phone numbers" above.
          example: 0812-3456-7890
        email:
          type: string
          format: email
          description: Optional. Stored lowercase.
        password:
          type: string
          minLength: 8
          maxLength: 128
        role:
          $ref: "#/components/schemas/UserRole"

    UpdateUserRequest:
      type: object
      required: [name, phone, email, role, status]
      properties:
        name:
          type: string
          maxLength: 100
        phone:
          type: string
          description: Normalized to E.164, see "Phone numbers" above.
        email:
          type: string
          description: Empty string clears it.
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserStatus"

    MosqueTimezone:
      type: string
      enum: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura]
      description: "WIB (`Asia/Jakarta`), WITA (`Asia/Makassar`) or WIT (`Asia/Jayapura`)."

    MosqueProfile:
      type: object
      required: [name, address, contact_phone, latitude, longitude, timezone]
      properties:
        name:
          type: string
          maxLength: 100
          example: Masjid Al-Ikhlas
        address:
          type: string
          maxLength: 500
          description: Optional, empty string when not set.
          example: Jl. Merdeka No. 1, Bandung
        contact_phone:
          type: string
          description: Optional, E.164 (normalized like user phones), empty string when not set.
          example: "+6281234567890"
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: -6.917464
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 107.619125
        timezone:
          $ref: "#/components/schemas/MosqueTimezone"

    Prayer:
      type: string
      enum: [subuh, dzuhur, ashar, maghrib, isya]
      description: Imsak and Terbit follow Subuh and sunrise; they are adjusted only by settings.

    PrayerSettings:
      type: object
      required: [corrections, imsak_offset_min, weekly_overrides, hijri_offset_days, hijri_offset_from]
      properties:
        corrections:
          type: object
          description: Minutes added to each computed time every day, -10 to 10.
          required: [subuh, terbit, dzuhur, ashar, maghrib, isya]
          properties:
            subuh: { type: integer, minimum: -10, maximum: 10, example: 0 }
            terbit: { type: integer, minimum: -10, maximum: 10, example: 0 }
            dzuhur: { type: integer, minimum: -10, maximum: 10, example: 0 }
            ashar: { type: integer, minimum: -10, maximum: 10, example: 0 }
            maghrib: { type: integer, minimum: -10, maximum: 10, example: 2 }
            isya: { type: integer, minimum: -10, maximum: 10, example: 0 }
        imsak_offset_min:
          type: integer
          minimum: 1
          maximum: 30
          description: Minutes before Subuh. Defaults to 10.
          example: 10
        weekly_overrides:
          type: array
          description: At most one per weekday and prayer.
          items:
            type: object
            required: [weekday, prayer, time, remarks]
            properties:
              weekday:
                type: string
                enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
              prayer:
                $ref: "#/components/schemas/Prayer"
              time:
                type: string
                example: "12:00"
              remarks:
                type: string
                maxLength: 100
                example: Sholat Jumat
        hijri_offset_days:
          type: integer
          minimum: -2
          maximum: 2
          description: Days added to the computed Hijri date, e.g. after the sidang isbat.
          example: 0
        hijri_offset_from:
          type: string
          description: The date (YYYY-MM-DD) the Hijri offset applies from; empty means always.
          example: ""

    PrayerTimeOverride:
      type: object
      required: [id, date, prayer, time, remarks, created_by, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          example: 4
        date:
          type: string
          format: date
          example: "2026-11-06"
        prayer:
          $ref: "#/components/schemas/Prayer"
        time:
          type: string
          example: "11:58"
        remarks:
          type: string
          example: Khatib tamu
        created_by:
          type: integer
          format: int64
          description: 0 when nobody created it, e.g. seeded.
          example: 7
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PrayerMinutes:
      type: object
      required: [subuh, dzuhur, ashar, maghrib, isya]
      properties:
        subuh: { type: integer }
        dzuhur: { type: integer }
        ashar: { type: integer }
        maghrib: { type: integer }
        isya: { type: integer }

    IqamahSettings:
      type: object
      required: [iqamah_min, sholat_min, adzan_display_min, sholat_display, jumat_before_min, khutbah_min, alarm]
      properties:
        iqamah_min:
          description: Minutes from the adzan time to iqamah, 1..30.
          allOf:
            - $ref: "#/components/schemas/PrayerMinutes"
        sholat_min:
          description: How long mode sholat lasts, 5..30; `jumat` 5..60.
          allOf:
            - $ref: "#/components/schemas/PrayerMinutes"
            - type: object
              required: [jumat]
              properties:
                jumat: { type: integer, example: 40 }
        adzan_display_min:
          type: integer
          minimum: 1
          maximum: 10
          description: How long the "Telah masuk waktu" screen stays up. Defaults to 4.
        sholat_display:
          type: string
          enum: [dim, black]
          description: "`dim`: \"Sholat sedang berlangsung\" and a small clock; `black`: a black screen."
        jumat_before_min:
          type: integer
          minimum: 0
          maximum: 120
          description: The Jumat screen shows this long before Friday Dzuhur; 0 turns it off.
        khutbah_min:
          type: integer
          minimum: 10
          maximum: 60
        alarm:
          type: object
          required: [enabled, at_adzan, before_iqamah, sound, volume]
          properties:
            enabled: { type: boolean }
            at_adzan: { type: boolean }
            before_iqamah: { type: boolean, description: The last 10 seconds before iqamah. }
            sound: { type: string, enum: [beep, bell] }
            volume: { type: integer, minimum: 0, maximum: 100 }

    FridayDuty:
      type: object
      required: [date, khatib, imam, muadzin, theme, updated_by, created_at, updated_at]
      properties:
        date: { type: string, format: date, example: "2026-11-06" }
        khatib: { type: string, example: Ustadz Abdullah }
        imam: { type: string, example: Ustadz Hasan }
        muadzin: { type: string, example: Bilal Ahmad }
        theme: { type: string, description: Tema khutbah., example: Menjaga amanah }
        updated_by: { type: integer, format: int64, description: 0 when nobody set it. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

  responses:
    InvalidInput:
      description: The request is malformed or a field is invalid; `message` says which.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INVALID_INPUT
            message: nomor HP tidak valid
    InvalidUserID:
      description: The `id` path parameter is not a positive integer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INVALID_INPUT
            message: id tidak valid
    Unauthenticated:
      description: |
        No token (`silakan login terlebih dahulu`), or the token is invalid,
        expired, logged out or replaced by a newer login
        (`sesi tidak valid, silakan login ulang`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: UNAUTHENTICATED
            message: sesi tidak valid, silakan login ulang
    Forbidden:
      description: The user's role is not allowed to call this endpoint.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: FORBIDDEN
            message: anda tidak memiliki akses
    UserNotFound:
      description: No user with this ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_FOUND
            message: user tidak ditemukan
    UserAlreadyExists:
      description: Another user already has this phone or email.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: ALREADY_EXISTS
            message: nomor HP atau email sudah terdaftar
    MosqueLogoNotFound:
      description: No logo has been uploaded yet.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_FOUND
            message: logo masjid belum diunggah
    TooLarge:
      description: The request body is over the size limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INVALID_INPUT
            message: ukuran request terlalu besar
    Internal:
      description: Unexpected server failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INTERNAL
            message: Internal Server Error
