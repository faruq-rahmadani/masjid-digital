                      $ref: "#/components/schemas/TransactionRevision"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/FinanceNotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/finance/transactions/{id}/receipt:
    get:
      tags: [Finance]
      summary: Get the receipt photo
      operationId: getReceipt
      description: "Any role."
      parameters:
        - $ref: "#/components/parameters/FinanceID"
      responses:
        "200":
          description: The photo.
          content:
            image/*:
              schema: {type: string, format: binary}
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/FinanceNotFound"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      tags: [Finance]
      summary: Attach or replace the receipt photo
      operationId: saveReceipt
      description: "`super_admin` and `bendahara`. Resized in the browser to at most 1 MB."
      parameters:
        - $ref: "#/components/parameters/FinanceID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary, description: "PNG, JPG or WebP, at most 1 MB"}
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: foto bukti disimpan
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/FinanceNotFound"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/BusinessRule"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/finance/transfers:
    post:
      tags: [Finance]
      summary: Pindah dana
      operationId: moveFunds
      description: "`super_admin` and `bendahara`. An out row on the source and an in row on the destination, sharing a `group_id`, in the system category Pindah dana and left out of the totals. Same kas with two accounts is setor/tarik tunai. Never into or out of zakat or fidyah; out of a terikat kas only with `note` and `donor_consent`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveFundsInput"
      responses:
        "201":
          description: The out and in rows.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/FinanceNotFound"
        "422":
          $ref: "#/components/responses/BusinessRule"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/finance/transfers/{group_id}:
    put:
      tags: [Finance]
      summary: Edit a Pindah dana
      operationId: updateMoveFunds
      description: "`super_admin` and `bendahara`. Same rules, with `reason`."
      parameters:
        - name: group_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveFundsInput"
      responses:
        "200":
          description: The out and in rows.
          content:
            application/json:
              schema:
                type: object
                required: [data]
