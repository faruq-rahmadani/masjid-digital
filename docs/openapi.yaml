      responses:
        "200":
          description: The setting.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/FinanceTvSetting"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      tags: [Finance]
      summary: Set the TV kas period
      operationId: updateFinanceTvSetting
      description: "`super_admin` and `bendahara`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceTvSetting"
      responses:
        "200":
          description: The setting.
          content:
            application/json:
              schema:
                type: object
                required: [data]
