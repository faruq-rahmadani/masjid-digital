openapi: 3.1.0
info:
  title: Masjid Digital API
  version: 1.0.0
  description: |
    Backend API of Masjid Digital. Each deployment serves a single mosque.

    ## Authentication
    `POST /api/v1/auth/login` returns an access token. Send it on every other
    request as `Authorization: Bearer <token>`, except the read-only
    `/api/public/v1/*` routes, which need no login (the TV display uses them).

    A user has one session at a time: logging in again (on any device) makes
    the previous token stop working. A token also stops working when the user
    logs out, is disabled, has their role changed, or has their password reset
    by an admin.

    ## Roles
    - `super_admin`: manages the whole app, including users
    - `takmir`: runs the mosque's operations
    - `bendahara`: the treasurer

    ## Errors
    Every error has the same body, `{"code": ..., "message": ...}`. `message`
    is in Indonesian and meant to be shown to the user as is. `code` maps to
    the HTTP status:

    | code              | status |
    |-------------------|--------|
    | `INVALID_INPUT`   | 400    |
    | `UNAUTHENTICATED` | 401    |
    | `FORBIDDEN`       | 403    |
    | `NOT_FOUND`       | 404    |
    | `ALREADY_EXISTS`  | 409    |
    | `BUSINESS_RULE`   | 422    |
    | `INTERNAL`        | 500    |

    Request bodies are limited to 1 MB (3 MB for the logo upload, 6 MB for a
    slide upload); a larger
    one gets `413` with `"ukuran request terlalu besar"`.

    ## Phone numbers
    Phones are stored in E.164 (`+6281234567890`). When creating or updating,
    `0812-3456-7890`, `6281234567890` and `+62 812 3456 7890` are all accepted
    and normalized; Indonesian numbers must be mobile numbers (`+628...`).
    On login the identifier is matched as is, so send the phone in E.164.
servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Users
    description: User management, `super_admin` only.
  - name: Mosque Profile
  - name: Prayer Times
    description: |
      Prayer times are computed on each device from the mosque's location with
      the Kemenag method (Subuh 20°, Isya 18°, ihtiyat 2 minutes); the server
      only stores how the mosque adjusts them. From the most general layer:
      computed time, then `corrections`, then a weekly override (e.g. every
      Friday Dzuhur), then a date override. The most specific one wins.
  - name: Iqamah
    description: |
      What the TV does around each prayer: the adzan screen, the iqamah countdown, mode sholat,
      and on Friday the Jumat screen and khutbah; plus the alarm.
  - name: Friday Duties
    description: Petugas Jumat (khatib, imam, muadzin, tema khutbah) per Friday, shown on the TV's Jumat screen.
  - name: Running Text
    description: |
      Short texts scrolling in the TV's INFO bar. Only active texts show, in
      `position` order; one scroll speed applies to all of them.
  - name: Slide
    description: |
      Images rotating in the TV's main panel. Only active slides show, in
      `position` order, each for its own `duration_seconds`. Every screen
      shows the same slides.
  - name: Screens
    description: |
      The TVs that opened `/tv` (layar TV). A TV makes a random device ID once and holds one
      server-sent events connection: connected is online, and its state, content refreshes and
      commands come down that connection. A device gets its row the first time it connects; last
      seen and the app version live in the cache. A blocked device is hidden from the admin and
      refused on connect.
  - name: Activity Log
    description: |
      Who changed what, newest first, for "Aktivitas terakhir" on Home. A row is written in the
      background after each successful change (users, mosque profile, prayer times, iqamah,
      petugas Jumat, running text, slides, screens, keuangan), so it may show up a moment after the change
      and is lost if the server stops before writing it. Logging in and changing one's own
      password are not logged.
  - name: Finance
    description: |
      Keuangan (E7). An account (akun) is where money sits: Tunai or a bank. A kas (`pockets`) is
      whose money it is: Kas Umum, Zakat Mal, Zakat Fitrah and Fidyah are built in; pengurus add
      terikat kas. Balances are computed from the last book closing plus the transactions after
      it, never stored. Read by any role; changed by `super_admin` and `bendahara`.
  - name: Public
    description: Read only, no login, for screens anyone can see (the TV display).

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthcheck
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: ok

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      operationId: login
      description: |
        Logs in with a phone number (E.164) or an email, and replaces any
        earlier session of the user. A wrong identifier and a wrong password
        give the same error, so the response does not reveal who is registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              phone:
                value:
                  identifier: "+6281234567890"
                  password: bismillah123
              email:
                value:
                  identifier: admin@masjid.id
                  password: bismillah123
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          description: Wrong identifier or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: UNAUTHENTICATED
                message: nomor HP/email atau password salah
        "403":
          description: The account is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: FORBIDDEN
                message: akun dinonaktifkan
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      operationId: logout
      description: Ends the current session, so the token stops working before it expires.
      responses:
        "200":
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: logout berhasil
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/profile:
    get:
      tags: [Auth]
      summary: Get own account
      operationId: getProfile
      description: Returns the logged in user. Any role.
      responses:
        "200":
          description: The logged in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserData"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/auth/password:
    put:
      tags: [Auth]
      summary: Change own password
      operationId: changePassword
      description: Any role. The current session stays logged in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: password berhasil diganti
        "400":
          description: |
            Invalid input, e.g. `password lama wajib di isi`,
            `password minimal 8 karakter`, `password lama salah`,
            `password baru harus berbeda dari password lama`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_INPUT
                message: password lama salah
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/activity-logs:
    get:
      tags: [Activity Log]
      summary: List recent activity
      operationId: listActivityLogs
      description: The latest changes, newest first. Any role.
      parameters:
        - name: limit
          in: query
          required: false
          description: How many to return.
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: The latest changes.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActivityLog"
        "400":
          description: "`limit harus angka 1-50`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_INPUT
                message: limit harus angka 1-50
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/users:
    post:
      tags: [Users]
      summary: Create a user
      operationId: createUser
      description: "`super_admin` only. The new user is `active`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: user berhasil dibuat
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/UserAlreadyExists"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      tags: [Users]
      summary: List users
      operationId: findAllUsers
      description: "`super_admin` only. Includes disabled users."
      responses:
        "200":
          description: All users.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [Users]
      summary: Get a user
      operationId: findUserByID
      description: "`super_admin` only."
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserData"
        "400":
          $ref: "#/components/responses/InvalidUserID"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      tags: [Users]
      summary: Update a user
      operationId: updateUser
      description: |
        `super_admin` only. Replaces every editable field, so send all of them;
        an empty `email` clears it. Disabling a user or changing their role
        logs them out. Admins cannot change their own role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserData"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            Not a `super_admin` (`anda tidak memiliki akses`), or changing
            one's own role (`tidak bisa mengubah role sendiri`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: FORBIDDEN
                message: tidak bisa mengubah role sendiri
        "404":
          $ref: "#/components/responses/UserNotFound"
        "409":
          $ref: "#/components/responses/UserAlreadyExists"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/UserID"
    put:
      tags: [Users]
      summary: Reset a user's password
      operationId: resetPassword
      description: |
        `super_admin` only. Sets a new password without the old one and logs
        the user out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: password berhasil direset
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /api/public/v1/time:
    get:
      tags: [Public]
      summary: Get the server's clock
      operationId: getServerTime
      security: []
      description: |
        The TV display corrects its own clock with this (a TV's clock is often
        unset or drifting). Sent with `Cache-Control: no-store`.
      responses:
        "200":
          description: The server's current time.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [now]
                    properties:
                      now:
                        type: integer
                        format: int64
                        description: Unix time in milliseconds.
                        example: 1793492835123

  /api/public/v1/mosque-profile:
    get:
      tags: [Public]
      summary: Get the mosque profile without logging in
      operationId: getPublicMosqueProfile
      security: []
      description: Same response as `GET /api/v1/mosque-profile`.
      responses:
        "200":
          description: The mosque profile.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MosqueProfile"
        "404":
          description: The profile has not been saved yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: NOT_FOUND
                message: profil masjid belum diisi
        "500":
          $ref: "#/components/responses/Internal"

  /api/public/v1/mosque-profile/logo:
    get:
      tags: [Public]
      summary: Get the mosque logo without logging in
      operationId: getPublicMosqueLogo
      security: []
      description: Same response as `GET /api/v1/mosque-profile/logo`.
      responses:
        "200":
          description: The logo.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [url]
                    properties:
                      url:
                        type: string
                        description: "`data:<content type>;base64,<image>`"
        "404":
          $ref: "#/components/responses/MosqueLogoNotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/mosque-profile:
    get:
      tags: [Mosque Profile]
      summary: Get the mosque profile
      operationId: getMosqueProfile
      description: Any role.
      responses:
        "200":
          description: The mosque profile.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MosqueProfile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: The profile has not been saved yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: NOT_FOUND
                message: profil masjid belum diisi
        "500":
          $ref: "#/components/responses/Internal"
    put:
      tags: [Mosque Profile]
      summary: Save the mosque profile
      operationId: updateMosqueProfile
      description: |
        `super_admin` and `takmir`. Replaces every field, so send all of them;
        an empty `address` or `contact_phone` clears it. Also creates the
        profile the first time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MosqueProfile"
      responses:
        "200":
          description: The saved profile.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MosqueProfile"
        "400":
          description: |
            Invalid input, e.g. `nama wajib di isi`, `alamat maksimal 500 karakter`,
            `kontak pengurus harus nomor HP yang valid`, `lokasi masjid wajib di isi`
            (latitude and longitude both 0), `koordinat lokasi tidak valid`,
            `zona waktu harus WIB, WITA, atau WIT`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_INPUT
                message: lokasi masjid wajib di isi
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/mosque-profile/logo:
    get:
      tags: [Mosque Profile]
      summary: Get the mosque logo
      operationId: getMosqueLogo
      description: Any role. The logo comes back as a data URI, usable directly as an `<img>` `src`.
      responses:
        "200":
          description: The logo.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [url]
                    properties:
                      url:
                        type: string
                        description: "`data:<content type>;base64,<image>`"
                        example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA...
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/MosqueLogoNotFound"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      tags: [Mosque Profile]
      summary: Upload the mosque logo
      operationId: updateMosqueLogo
      description: |
        `super_admin` and `takmir`. Replaces the current logo. PNG, JPEG or
        WebP up to 2 MB; the format is detected from the file's content, not
        its name or declared type. SVG is not accepted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The logo image.
      responses:
        "200":
          description: Logo saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: logo masjid berhasil disimpan
        "400":
          description: |
            Invalid upload, e.g. `file logo wajib diunggah`,
            `ukuran logo maksimal 2 MB`, `format logo harus PNG, JPG, atau WebP`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_INPUT
                message: format logo harus PNG, JPG, atau WebP
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/TooLarge"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [Mosque Profile]
      summary: Delete the mosque logo
      operationId: deleteMosqueLogo
      description: "`super_admin` and `takmir`."
      responses:
        "200":
          description: Logo deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: logo masjid berhasil dihapus
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MosqueLogoNotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /api/public/v1/prayer-time/config:
    get:
      tags: [Public, Prayer Times]
      summary: Get what a device needs to compute the prayer times
      operationId: getPrayerConfig
      security: []
      description: |
        The settings (defaults until first saved) and the date overrides from
        today to 30 days ahead, so a TV keeps showing correct times offline.
      responses:
        "200":
          description: The prayer config.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [settings, overrides]
                    properties:
                      settings:
                        $ref: "#/components/schemas/PrayerSettings"
                      overrides:
                        type: array
                        items:
                          $ref: "#/components/schemas/PrayerTimeOverride"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/prayer-time/config:
    get:
      tags: [Prayer Times]
      summary: Get the prayer settings
      operationId: getPrayerSettings
      description: Any role. Returns the defaults until first saved.
      responses:
        "200":
          description: The prayer settings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PrayerSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      tags: [Prayer Times]
      summary: Save the prayer settings
      operationId: updatePrayerSettings
      description: |
        `super_admin` and `takmir`. Replaces every setting, so send all of them.
        Also creates the settings the first time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrayerSettings"
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PrayerSettings"
        "400":
          description: |
            Invalid input, e.g. `koreksi waktu harus antara -10 dan +10 menit`,
            `imsak harus 1 sampai 30 menit sebelum subuh`, `hari tidak valid`,
            `format jam harus HH:MM`,
            `satu waktu sholat hanya boleh punya satu jadwal mingguan per hari`,
            `koreksi tanggal hijriah harus antara -2 dan +2 hari`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_INPUT
                message: koreksi waktu harus antara -10 dan +10 menit
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/prayer-time/overrides:
    get:
      tags: [Prayer Times]
      summary: List the date overrides in a range
      operationId: listPrayerOverrides
      description: Any role. Ordered by date, then prayer.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
            example: "2026-11-01"
        - name: to
          in: query
          required: true
          description: Inclusive, at most 366 days after `from`.
          schema:
            type: string
            format: date
            example: "2026-11-30"
      responses:
        "200":
          description: The overrides.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PrayerTimeOverride"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [Prayer Times]
      summary: Override one prayer time on one date
      operationId: createPrayerOverride
      description: "`super_admin` and `takmir`. The date must not be in the past."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, prayer, time]
              properties:
                date:
                  type: string
                  format: date
                  example: "2026-11-06"
                prayer:
                  $ref: "#/components/schemas/Prayer"
                time:
                  type: string
                  pattern: "^\\d{2}:\\d{2}$"
                  example: "11:58"
                remarks:
                  type: string
                  maxLength: 100
                  example: Khatib tamu
      responses:
        "201":
          description: The created override.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PrayerTimeOverride"
        "400":
          description: |
            Invalid input, e.g. `format tanggal harus YYYY-MM-DD`,
            `waktu sholat tidak valid`, `format jam harus HH:MM`, `tanggal sudah lewat`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: INVALID_INPUT
                message: tanggal sudah lewat
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The prayer already has an override on that date; delete it first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: ALREADY_EXISTS
                message: waktu sholat ini sudah punya jadwal khusus di tanggal tersebut
        "500":
          $ref: "#/components/responses/Internal"

